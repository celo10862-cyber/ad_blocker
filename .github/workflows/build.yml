name: Build NetShield APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug and release APKs
        run: gradle --no-daemon clean assembleDebug assembleRelease

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NetShield-AdBlocker-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/NetShield-AdBlocker-release-unsigned.apk

      - name: Sign release APK when persistent signing secrets are configured
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && env.RELEASE_KEYSTORE_PASSWORD != '' && env.RELEASE_KEY_ALIAS != '' && env.RELEASE_KEY_PASSWORD != '' }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          BUILD_TOOLS=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -p 4 dist/NetShield-AdBlocker-release-unsigned.apk dist/NetShield-aligned.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks release-keystore.jks \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --out dist/NetShield-AdBlocker-release-signed.apk dist/NetShield-aligned.apk
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose dist/NetShield-AdBlocker-release-signed.apk
          rm -f release-keystore.jks dist/NetShield-aligned.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetShield-AdBlocker-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub release for main-branch pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: netshield-v1.1.${{ github.run_number }}
          name: NetShield AdBlocker v1.1.${{ github.run_number }}
          generate_release_notes: true
          files: dist/*.apk
