name: Build, Sign & Release NetShield AdBlocker APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Auto-generate release keystore & signing config (zero manual setup)
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v             -keystore release-keystore.jks             -storetype JKS             -keyalg RSA             -keysize 2048             -validity 10000             -alias netshield_release             -storepass "$PASS"             -keypass "$PASS"             -dname "CN=NetShield AdBlocker, OU=Mobile, O=NetShield, L=Kathmandu, S=Bagmati, C=NP"

          cat <<EOF > release-signing.properties
          storePassword=$PASS
          keyPassword=$PASS
          keyAlias=netshield_release
          EOF

      - name: Build Debug & Signed Release APKs
        run: gradle assembleDebug assembleRelease

      - name: Collect & rename APKs
        id: apk_files
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NetShield-AdBlocker-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/NetShield-AdBlocker-release-signed.apk

          RUN_NUM=${{ github.run_number }}
          TAG_NAME="v1.0.${RUN_NUM}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetShield-AdBlocker-APKs
          path: dist/*.apk

      - name: Create Git Tag & Publish GitHub Release with Both APKs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_files.outputs.tag_name }}
          name: "NetShield AdBlocker ${{ steps.apk_files.outputs.tag_name }}"
          body: |
            Automated build **#${{ github.run_number }}** from commit `${{ github.sha }}`.

            ### Included APKs
            - **Debug APK (`NetShield-AdBlocker-debug.apk`)**: Auto-built debug package.
            - **Signed Release APK (`NetShield-AdBlocker-release-signed.apk`)**: Automatically signed during CI with an auto-generated release keystore.
          files: |
            dist/NetShield-AdBlocker-debug.apk
            dist/NetShield-AdBlocker-release-signed.apk
          draft: false
          prerelease: false
